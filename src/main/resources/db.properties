# Configuracion de la conexion JDBC.
# --- Opcion 1 (por defecto): H2 en memoria, no requiere instalar nada ---
bd.url=jdbc:h2:mem:filey;DB_CLOSE_DELAY=-1
bd.usuario=sa
bd.password=
# Crea tablas y datos de ejemplo al arrancar (solo tiene sentido con BD en memoria)
bd.inicializar=true

